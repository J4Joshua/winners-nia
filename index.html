<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stratos — Agentic AI for growing teams</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
/* ============================================
   STRATOS — Enterprise AI Landing
   Design tokens & global styles
   ============================================ */

:root {
  /* Brand */
  --brand-50:  #EEF2FF;
  --brand-100: #DEE6FF;
  --brand-200: #C2CFFF;
  --brand-300: #9BB0FF;
  --brand-400: #7290FF;
  --brand-500: #4F6BFF;   /* primary */
  --brand-600: #3A52E8;
  --brand-700: #2A3FBE;
  --brand-800: #1E2E8C;
  --brand-ink: #0B1452;   /* deep brand for hover etc. */

  /* Neutrals (cool-tinted) */
  --ink-900: #0E1320;
  --ink-800: #1A2032;
  --ink-700: #2A3146;
  --ink-600: #4A5269;
  --ink-500: #6B7286;
  --ink-400: #9098AC;
  --ink-300: #C2C7D6;
  --ink-200: #E3E6EF;
  --ink-100: #EEF0F6;
  --ink-50:  #F6F7FB;
  --white:   #FFFFFF;

  /* Soft tints used for blue feature cards */
  --tint-blue: #5A7BFF;     /* slightly lighter than 500 for hero card bg */
  --tint-blue-2: #6E8AFF;
  --tint-lilac: #EEF0FF;    /* the soft lilac panel from refs */

  /* Spacing & radii */
  --radius-card: 28px;
  --radius-pill: 999px;
  --radius-md: 14px;
  --radius-sm: 10px;

  /* Shadows */
  --shadow-card: 0 1px 2px rgba(14,19,32,.04), 0 12px 32px -8px rgba(14,19,32,.08);
  --shadow-soft: 0 1px 2px rgba(14,19,32,.04), 0 24px 60px -16px rgba(14,19,32,.10);
  --shadow-cta: 0 6px 20px -4px rgba(79,107,255,.55), 0 1px 0 rgba(255,255,255,.4) inset;

  /* Type */
  --font-sans: "Geist", "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-sans);
  color: var(--ink-900);
  background: var(--white);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "cv11";
  line-height: 1.45;
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; }
a { color: inherit; text-decoration: none; }

::selection {
  background: var(--brand-200);
  color: var(--ink-900);
}

/* ====== Layout ====== */
.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 32px;
}
.container-narrow {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 32px;
}

section {
  padding: 120px 0;
}
section + section { padding-top: 0; }

@media (max-width: 760px) {
  section { padding: 80px 0; }
  .container, .container-narrow { padding: 0 20px; }
}

/* ====== Typography ====== */
h1, h2, h3, h4 {
  margin: 0;
  letter-spacing: -0.025em;
  line-height: 1.05;
  font-weight: 600;
}
h1 {
  font-size: clamp(44px, 6.2vw, 84px);
  letter-spacing: -0.035em;
  line-height: 1.0;
}
h2 {
  font-size: clamp(36px, 4.6vw, 64px);
  letter-spacing: -0.028em;
}
h3 {
  font-size: clamp(22px, 1.8vw, 28px);
  letter-spacing: -0.018em;
}
p { margin: 0; }

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--brand-600);
  background: var(--brand-50);
  padding: 7px 12px 7px 10px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--brand-100);
}
.eyebrow::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--brand-500);
  box-shadow: 0 0 0 4px rgba(79,107,255,.18);
}

.lede {
  font-size: clamp(17px, 1.25vw, 20px);
  color: var(--ink-600);
  line-height: 1.55;
  max-width: 640px;
}

/* ====== Buttons ====== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 22px;
  border-radius: var(--radius-pill);
  font-size: 15px;
  font-weight: 500;
  transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }

.btn-primary {
  color: white;
  background: linear-gradient(180deg, var(--brand-400) 0%, var(--brand-500) 50%, var(--brand-600) 100%);
  box-shadow: var(--shadow-cta);
  position: relative;
}
.btn-primary::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,0) 40%);
  pointer-events: none;
}
.btn-primary:hover {
  box-shadow: 0 10px 30px -4px rgba(79,107,255,.6), 0 1px 0 rgba(255,255,255,.4) inset;
  transform: translateY(-1px);
}

.btn-ghost {
  color: var(--ink-900);
  background: transparent;
  border: 1px solid var(--ink-200);
}
.btn-ghost:hover {
  background: var(--ink-50);
  border-color: var(--ink-300);
}

.btn-dark {
  color: white;
  background: var(--ink-900);
}
.btn-dark:hover { background: var(--ink-800); }

.btn .arrow {
  display: inline-flex;
  transition: transform .2s ease;
}
.btn:hover .arrow { transform: translateX(3px); }

/* ====== Pills & badges ====== */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 500;
  background: var(--ink-100);
  color: var(--ink-700);
  border: 1px solid var(--ink-200);
}
.pill-inline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 14px 4px 10px;
  border-radius: var(--radius-pill);
  background: rgba(255,255,255,0.18);
  color: white;
  font-size: 0.84em;
  font-weight: 500;
  vertical-align: middle;
  margin: 0 4px;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.18);
}
.pill-inline.light {
  background: var(--brand-50);
  color: var(--brand-700);
  border-color: var(--brand-100);
}

/* ====== Cards ====== */
.card {
  background: var(--white);
  border-radius: var(--radius-card);
  border: 1px solid var(--ink-200);
  overflow: hidden;
}

.card-feature {
  border-radius: var(--radius-card);
  padding: 44px;
  position: relative;
  overflow: hidden;
}
.card-feature-blue {
  background: linear-gradient(180deg, #7290FF 0%, var(--tint-blue) 100%);
  color: white;
}
.card-feature-light {
  background: var(--ink-50);
  border: 1px solid var(--ink-200);
  color: var(--ink-900);
}

@media (max-width: 760px) {
  .card-feature { padding: 28px; }
}

/* ====== Nav ====== */
.nav {
  position: sticky;
  top: 0;
  z-index: 80;
  background: rgba(255,255,255,0.75);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease, background .2s ease;
}
.nav.scrolled {
  border-bottom-color: var(--ink-200);
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  max-width: 1400px;
  margin: 0 auto;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 18px;
  letter-spacing: -0.02em;
}
.nav-logo .glyph {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--ink-900);
  display: grid; place-items: center;
  color: white;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
}
.nav-links a {
  font-size: 14px;
  color: var(--ink-700);
  font-weight: 500;
  transition: color .15s ease;
}
.nav-links a:hover { color: var(--ink-900); }

@media (max-width: 860px) {
  .nav-links { display: none; }
}

/* ====== Hero ====== */
.hero {
  padding-top: 64px;
  padding-bottom: 80px;
  position: relative;
  overflow: hidden;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 64px;
  align-items: center;
}
@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; gap: 40px; }
}
.hero-copy h1 {
  margin-top: 28px;
  margin-bottom: 24px;
}
.hero-copy .lede {
  margin-bottom: 36px;
}
.hero-cta-row {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.hero-trust {
  margin-top: 56px;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
.hero-trust-label {
  font-size: 12.5px;
  color: var(--ink-500);
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.hero-trust-logos {
  display: flex;
  gap: 28px;
  align-items: center;
  flex-wrap: wrap;
}
.hero-trust-logos .logo {
  font-family: var(--font-mono);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-400);
  letter-spacing: 0.02em;
}

/* Hero ambient blob */
.hero-blob {
  position: absolute;
  top: -160px;
  right: -120px;
  width: 720px; height: 720px;
  background: radial-gradient(closest-side, rgba(79,107,255,.18), rgba(79,107,255,0));
  filter: blur(10px);
  pointer-events: none;
  z-index: -1;
}

/* ====== Hero product mock ====== */
.hero-mock-wrap {
  position: relative;
  perspective: 1400px;
}
.hero-mock {
  background: linear-gradient(180deg, #7896FF 0%, #5A7BFF 100%);
  border-radius: 32px;
  padding: 28px;
  position: relative;
  box-shadow:
    0 30px 80px -20px rgba(79,107,255,.45),
    0 2px 0 rgba(255,255,255,.4) inset;
  overflow: hidden;
}
.hero-mock::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,.22), transparent 50%),
    radial-gradient(80% 60% at 100% 100%, rgba(255,255,255,.10), transparent 50%);
  pointer-events: none;
}
.hero-mock-inner {
  background: rgba(255,255,255,0.96);
  border-radius: 18px;
  padding: 18px;
  position: relative;
  box-shadow: 0 20px 50px -10px rgba(0,0,0,.18);
}

/* Agent runner UI */
.agent-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--ink-100);
}
.agent-title-row {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 600;
  color: var(--ink-900);
}
.agent-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #10B981;
  box-shadow: 0 0 0 4px rgba(16,185,129,.18);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(16,185,129,.18); }
  50% { box-shadow: 0 0 0 6px rgba(16,185,129,.08); }
}
.agent-status {
  font-size: 12px;
  color: var(--ink-500);
  font-family: var(--font-mono);
}
.agent-steps {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.agent-step {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--ink-50);
  font-size: 13px;
  color: var(--ink-700);
  transition: all .3s ease;
}
.agent-step.active {
  background: var(--brand-50);
  color: var(--brand-700);
}
.agent-step.done {
  color: var(--ink-500);
}
.agent-step-icon {
  width: 18px; height: 18px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--ink-200);
  color: white;
  flex-shrink: 0;
}
.agent-step.done .agent-step-icon { background: #10B981; }
.agent-step.active .agent-step-icon {
  background: var(--brand-500);
  animation: spin 1.4s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.agent-step-meta {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-400);
}

/* Floating callout above mock */
.hero-callout {
  position: absolute;
  top: -28px;
  left: -32px;
  background: var(--ink-900);
  color: white;
  padding: 14px 20px;
  border-radius: 20px;
  font-size: 14.5px;
  font-weight: 500;
  box-shadow: 0 20px 40px -10px rgba(0,0,0,.25);
  z-index: 2;
}
.hero-callout::after {
  content: "";
  position: absolute;
  bottom: -8px; left: 32px;
  width: 16px; height: 16px;
  background: var(--ink-900);
  transform: rotate(45deg);
  border-radius: 2px;
}
@media (max-width: 980px) {
  .hero-callout { left: 12px; top: -20px; font-size: 13px; padding: 10px 14px; }
}

/* ====== Section header ====== */
.section-header {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 56px;
}
.section-header.centered {
  align-items: center;
  text-align: center;
}
.section-header.centered .lede { text-align: center; }

/* ====== How it works (two-card) ====== */
.two-card {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 900px) {
  .two-card { grid-template-columns: 1fr; }
}

/* In-card mock surfaces */
.mock-surface {
  background: rgba(255,255,255,0.96);
  border-radius: 16px;
  padding: 16px;
  margin-top: 24px;
  box-shadow: 0 14px 30px -8px rgba(0,0,0,.16);
  color: var(--ink-900);
  font-size: 13px;
}
.mock-surface.dark {
  background: #14182A;
  color: #D5DAF0;
  box-shadow: 0 14px 30px -8px rgba(0,0,0,.4);
}

/* ====== Metrics big numbers ====== */
.metrics-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid var(--ink-200);
  border-bottom: 1px solid var(--ink-200);
}
@media (max-width: 900px) {
  .metrics-row { grid-template-columns: repeat(2, 1fr); }
}
.metric {
  padding: 36px 28px;
  border-right: 1px solid var(--ink-200);
}
.metric:last-child { border-right: 0; }
@media (max-width: 900px) {
  .metric:nth-child(2n) { border-right: 0; }
  .metric:nth-child(1), .metric:nth-child(2) { border-bottom: 1px solid var(--ink-200); }
}
.metric-value {
  font-size: clamp(40px, 4.4vw, 64px);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1;
  margin-bottom: 12px;
  color: var(--ink-900);
}
.metric-value .unit {
  color: var(--brand-500);
}
.metric-label {
  font-size: 14px;
  color: var(--ink-600);
  line-height: 1.45;
}

/* ====== Case studies ====== */
.case-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
@media (max-width: 980px) { .case-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 700px) { .case-grid { grid-template-columns: 1fr; } }

.case-card {
  background: var(--white);
  border: 1px solid var(--ink-200);
  border-radius: 24px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform .2s ease, box-shadow .25s ease, border-color .2s ease;
  cursor: pointer;
}
.case-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-soft);
  border-color: var(--ink-300);
}
.case-art {
  aspect-ratio: 4 / 3;
  position: relative;
  overflow: hidden;
}
.case-tag {
  position: absolute;
  top: 16px; left: 16px;
  z-index: 2;
}
.case-body {
  padding: 24px 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
}
.case-metric {
  font-size: 40px;
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1;
  color: var(--brand-600);
}
.case-title {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--ink-900);
}
.case-desc {
  font-size: 14.5px;
  color: var(--ink-600);
  line-height: 1.5;
}
.case-cta {
  margin-top: auto;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-900);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

/* Case artwork variations */
.case-art-1 {
  background:
    radial-gradient(60% 50% at 30% 30%, #B1C0FF 0%, #6A88FF 60%, #4F6BFF 100%);
}
.case-art-2 {
  background:
    radial-gradient(60% 50% at 70% 40%, #C7B5FF 0%, #8B7BFF 60%, #4F4FE0 100%);
}
.case-art-3 {
  background:
    radial-gradient(60% 50% at 50% 60%, #A7E5FF 0%, #5DB7FF 60%, #2E7BD9 100%);
}

/* ====== Capabilities 3-up ====== */
.cap-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
@media (max-width: 900px) { .cap-grid { grid-template-columns: 1fr; } }

.cap-card {
  background: var(--ink-50);
  border-radius: 24px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.cap-visual {
  background: white;
  border-radius: 16px;
  padding: 22px;
  aspect-ratio: 4 / 3;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--ink-200);
}
.cap-body {
  padding: 4px 12px 14px;
}
.cap-title {
  font-weight: 600;
  font-size: 17px;
  color: var(--ink-900);
  margin-bottom: 6px;
  letter-spacing: -0.015em;
}
.cap-desc {
  font-size: 14.5px;
  color: var(--ink-600);
  line-height: 1.5;
}

/* ====== FAQ ====== */
.faq {
  border-top: 1px solid var(--ink-200);
}
.faq-row {
  border-bottom: 1px solid var(--ink-200);
}
.faq-q {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 4px;
  text-align: left;
  font-size: 19px;
  font-weight: 500;
  color: var(--ink-900);
  letter-spacing: -0.01em;
}
.faq-q .chevron {
  width: 20px; height: 20px;
  color: var(--ink-500);
  transition: transform .25s ease;
}
.faq-row.open .chevron { transform: rotate(180deg); }
.faq-a {
  max-height: 0;
  overflow: hidden;
  transition: max-height .35s ease;
}
.faq-row.open .faq-a {
  max-height: 300px;
}
.faq-a-inner {
  padding: 0 4px 28px;
  color: var(--ink-600);
  font-size: 15.5px;
  line-height: 1.6;
  max-width: 760px;
}

/* ====== Final CTA / book a call ====== */
.book-section {
  padding: 120px 0;
}
.book-card {
  background: linear-gradient(180deg, #6E8AFF 0%, #4F6BFF 100%);
  border-radius: 36px;
  padding: 64px;
  color: white;
  position: relative;
  overflow: hidden;
  box-shadow: 0 40px 80px -20px rgba(79,107,255,.45);
}
.book-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(60% 80% at 100% 0%, rgba(255,255,255,.20), transparent 60%),
    radial-gradient(60% 80% at 0% 100%, rgba(255,255,255,.10), transparent 60%);
  pointer-events: none;
}
.book-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 56px;
  align-items: center;
  position: relative;
  z-index: 1;
}
@media (max-width: 900px) {
  .book-grid { grid-template-columns: 1fr; gap: 36px; }
  .book-card { padding: 36px; }
}
.book-card h2 { color: white; margin-bottom: 20px; }
.book-card .lede { color: rgba(255,255,255,0.88); }

.book-rep {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(12px);
  border-radius: 24px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.rep-head {
  display: flex;
  align-items: center;

  font-size: 20px;
  color: #5C2A00;

  border: 2px solid rgba(255,255,255,0.25);

.rep-role {

  display: inline-flex;
  align-items: center;
  gap: 10px;
  width: fit-content;
  transition: transform .15s ease, box-shadow .2s ease;
}
.book-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 30px -4px rgba(0,0,0,.2);
}

.footer {
  border-top: 1px solid var(--ink-200);
  padding: 64px 0 40px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 48px;
  margin-bottom: 48px;
}

.footer-col h4 {

.footer-col ul { list-style: none; padding: 0; margin: 0; }

.footer-col a {

  color: var(--ink-700);
}
.footer-col a:hover { color: var(--ink-900); }
.footer-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 32px;
  border-top: 1px solid var(--ink-200);
  font-size: 13px;
  color: var(--ink-500);

.modal-backdrop {

  z-index: 200;
  display: grid;
  place-items: center;
  padding: 24px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: white;
  border-radius: 24px;
  max-width: 520px;
  width: 100%;
  max-height: 90vh;
  overflow: auto;
  box-shadow: 0 40px 100px -20px rgba(0,0,0,.4);
  animation: rise .25s ease;
}
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-head {
  padding: 24px 28px 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.modal-head h3 {
  font-size: 22px;
  margin-bottom: 4px;

.modal-sub {

.modal-close {

.modal-close:hover { background: var(--ink-200); }
.modal-body {

}
.modal-steps {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}
.modal-step-pip {

  height: 4px;
  border-radius: 99px;
  background: var(--ink-100);
  transition: background .2s ease;
}
.modal-step-pip.active { background: var(--brand-500); }

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.date-cell {
  border: 1px solid var(--ink-200);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  transition: all .15s ease;
  background: white;

.date-cell:hover { border-color: var(--ink-400); }
.date-cell.selected {
  background: var(--brand-500);
  color: white;
  border-color: var(--brand-500);
}
.date-cell.disabled {

}
.date-dow {

}
.date-cell.selected .date-dow { color: rgba(255,255,255,0.8); }
.date-day {

  grid-template-columns: repeat(3, 1fr);

.time-cell {

.time-cell:hover { border-color: var(--ink-400); }
.time-cell.selected {

.form-row-2 {

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">
// Booking modal — 3 step flow: date → time → details → success
const { useState, useMemo } = React;

function BookingModal({ open, onClose, rep }) {
  const [step, setStep] = useState(0);
  const [date, setDate] = useState(null);
  const [time, setTime] = useState(null);
  const [form, setForm] = useState({
    name: "", email: "", company: "", teamSize: "11–50", topic: "Cost reduction audit"
  });
  const [done, setDone] = useState(false);

  // Generate next 14 weekdays
  const dates = useMemo(() => {
    const out = [];
    const today = new Date();
    let d = new Date(today);
    while (out.length < 12) {
      d.setDate(d.getDate() + 1);
      const dow = d.getDay();
      if (dow === 0 || dow === 6) continue;
      out.push(new Date(d));
    }
    return out;
  }, []);

  const slots = ["09:00", "09:30", "10:30", "11:00", "13:00", "14:00", "15:30", "16:00", "17:00"];

  const reset = () => {
    setStep(0); setDate(null); setTime(null); setDone(false);
    setForm({ name: "", email: "", company: "", teamSize: "11–50", topic: "Cost reduction audit" });
  };

  const close = () => { onClose(); setTimeout(reset, 220); };

  const next = () => setStep((s) => Math.min(s + 1, 2));
  const back = () => setStep((s) => Math.max(s - 1, 0));
  const submit = (e) => { e.preventDefault(); setDone(true); };

  const canNext = (step === 0 && date) || (step === 1 && time);

  if (!open) return null;

  return (
    <div className="modal-backdrop" onClick={close}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        {!done && (
          <>
            <div className="modal-head">
              <div>
                <h3>Book a strategy call</h3>
                <div className="modal-sub">30 min with {rep.name} · {rep.role}</div>
              </div>
              <button className="modal-close" onClick={close} aria-label="Close">
                <IconClose size={16} />
              </button>
            </div>

            <div className="modal-body">
              <div className="modal-steps">
                {[0,1,2].map((i) => (
                  <div key={i} className={`modal-step-pip ${i <= step ? "active" : ""}`} />
                ))}
              </div>

              {step === 0 && (
                <>
                  <div style={{ marginBottom: 14, fontSize: 14, color: "var(--ink-700)", fontWeight: 500 }}>
                    Pick a date — all times shown in your local timezone.
                  </div>
                  <div className="date-grid">
                    {dates.map((d, i) => {
                      const sel = date && d.toDateString() === date.toDateString();
                      return (
                        <button
                          key={i}
                          className={`date-cell ${sel ? "selected" : ""}`}
                          onClick={() => setDate(d)}
                        >
                          <div className="date-dow">{d.toLocaleDateString("en-US", { weekday: "short" })}</div>
                          <div className="date-day">{d.getDate()}</div>
                          <div className="date-dow" style={{ marginTop: 4 }}>
                            {d.toLocaleDateString("en-US", { month: "short" })}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </>
              )}

              {step === 1 && (
                <>
                  <div style={{ marginBottom: 14, fontSize: 14, color: "var(--ink-700)", fontWeight: 500 }}>
                    {date && date.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" })} — pick a time slot.
                  </div>
                  <div className="time-grid">
                    {slots.map((s) => (
                      <button
                        key={s}
                        className={`time-cell ${time === s ? "selected" : ""}`}
                        onClick={() => setTime(s)}
                      >
                        {s}
                      </button>
                    ))}
                  </div>
                </>
              )}

              {step === 2 && (
                <form className="form-grid" onSubmit={submit}>
                  <div className="form-row-2">
                    <div className="form-field">
                      <label>Full name</label>
                      <input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Alex Rivera" />
                    </div>
                    <div className="form-field">
                      <label>Work email</label>
                      <input required type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="alex@company.com" />
                    </div>
                  </div>
                  <div className="form-field">
                    <label>Company</label>
                    <input required value={form.company} onChange={(e) => setForm({ ...form, company: e.target.value })} placeholder="Northbeam Logistics" />
                  </div>
                  <div className="form-row-2">
                    <div className="form-field">
                      <label>Team size</label>
                      <select value={form.teamSize} onChange={(e) => setForm({ ...form, teamSize: e.target.value })}>
                        <option>1–10</option>
                        <option>11–50</option>
                        <option>51–200</option>
                        <option>200–500</option>
                      </select>
                    </div>
                    <div className="form-field">
                      <label>I want to talk about</label>
                      <select value={form.topic} onChange={(e) => setForm({ ...form, topic: e.target.value })}>
                        <option>Cost reduction audit</option>
                        <option>Customer support agent</option>
                        <option>Finance & ops automation</option>
                        <option>Sales pipeline agent</option>
                        <option>Something else</option>
                      </select>
                    </div>
                  </div>

                  {/* hidden submit so Enter works */}
                  <button type="submit" style={{ display: "none" }} />
                </form>
              )}

              <div className="modal-actions">
                {step > 0 ? (
                  <button className="btn btn-ghost" onClick={back}>Back</button>
                ) : (
                  <button className="btn btn-ghost" onClick={close}>Cancel</button>
                )}
                {step < 2 ? (
                  <button
                    className="btn btn-primary"
                    onClick={next}
                    disabled={!canNext}
                    style={{ opacity: canNext ? 1 : 0.5 }}
                  >
                    Continue <span className="arrow"><IconArrow size={14} /></span>
                  </button>
                ) : (
                  <button
                    className="btn btn-primary"
                    onClick={submit}
                    disabled={!form.name || !form.email || !form.company}
                    style={{ opacity: (!form.name || !form.email || !form.company) ? 0.5 : 1 }}
                  >
                    Confirm booking <span className="arrow"><IconArrow size={14} /></span>
                  </button>
                )}
              </div>

  "accent": "#4F6BFF",
  "headline": "The teammate that runs your back office while you sleep.",
  "tagline": "Stratos deploys task-specific AI agents that own end-to-end workflows in finance, operations, and customer support — proven to save growing teams 30%+ on operating costs in 90 days.",
  "rep": "Maya"
}/*EDITMODE-END*/;

const REPS = {
  "Maya":   { name: "Maya Okafor",  role: "Solutions Engineer · Stratos", initials: "MO" },
  "David":  { name: "David Chen",   role: "Head of Customer Success",     initials: "DC" },
  "Priya":  { name: "Priya Vasan",  role: "Founding Solutions Engineer",  initials: "PV" },
};

function Nav({ onBook }) {
  const [scrolled, setScrolled] = useStateA(false);
  useEffectA(() => {
    const onScroll = () => setScrolled(window.scrollY > 12);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <nav className={`nav ${scrolled ? "scrolled" : ""}`}>
      <div className="nav-inner">
        <div className="nav-logo">
          <span className="glyph"><IconLogo size={16} /></span>
          Stratos
        </div>
        <div className="nav-links">
          <a href="#how">Product</a>
          <a href="#customers">Customers</a>
          <a href="#capabilities">Security</a>
          <a href="#faq">FAQ</a>
        </div>
        <button className="btn btn-primary" onClick={onBook} style={{ padding: "10px 18px", fontSize: 14 }}>
          Book a call <span className="arrow"><IconArrow size={13} /></span>
        </button>
      </div>
    </nav>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [modalOpen, setModalOpen] = useStateA(false);

  const rep = REPS[t.rep] || REPS.Maya;

  // Apply accent live via CSS var
  useEffectA(() => {
    document.documentElement.style.setProperty("--brand-500", t.accent);
  }, [t.accent]);

  const onBook = () => setModalOpen(true);

  return (
    <>
      <Nav onBook={onBook} />
      <Hero onBook={onBook} headline={t.headline} tagline={t.tagline} />
      <HowItWorks />
      <Metrics />
      <CaseStudies />
      <Capabilities />
      <FAQ />
      <BookSection onBook={onBook} rep={rep} />
      <Footer />

      <BookingModal open={modalOpen} onClose={() => setModalOpen(false)} rep={rep} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand" />
        <TweakColor
          label="Accent"
          value={t.accent}
          onChange={(v) => setTweak("accent", v)}
          options={["#4F6BFF", "#2A6FDB", "#0EA5E9", "#6E40C9", "#0F172A"]}
        />

        <TweakSection label="Hero copy" />
        <TweakText
          label="Headline"
          value={t.headline}
          onChange={(v) => setTweak("headline", v)}
        />
        <TweakText
          label="Tagline"
          value={t.tagline}
          onChange={(v) => setTweak("tagline", v)}
        />

        <TweakSection label="Sales rep" />
        <TweakRadio
          label="Who handles the call"
          value={t.rep}
          onChange={(v) => setTweak("rep", v)}
          options={["Maya", "David", "Priya"]}
        />

        <TweakSection label="Booking flow" />
        <TweakButton label="Open booking modal" onClick={onBook} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
